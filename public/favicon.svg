<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A30" />
      <stop offset="100%" stop-color="#070F1E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="50%" stop-color="#E5B842" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="128" fill="url(#navyBg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-opacity="0.8" />

  <!-- WiFi Broadcast Arcs -->
