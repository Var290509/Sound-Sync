    <rect x="150" y="270" width="22" height="90" rx="11" fill-opacity="0.6" />
    <rect x="192" y="240" width="24" height="150" rx="12" fill-opacity="0.85" />
    <rect x="236" y="210" width="26" height="210" rx="13" />
    <rect x="280" y="230" width="26" height="170" rx="13" />
    <rect x="324" y="260" width="24" height="110" rx="12" fill-opacity="0.8" />
    <rect x="364" y="280" width="22" height="70" rx="11" fill-opacity="0.5" />
