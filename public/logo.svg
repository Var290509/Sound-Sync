<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Atlas Navy -->
    <linearGradient id="navyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A30" />
      <stop offset="50%" stop-color="#070F1E" />
      <stop offset="100%" stop-color="#030812" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" />
      <stop offset="35%" stop-color="#E5B842" />
      <stop offset="70%" stop-color="#F3C766" />
      <stop offset="100%" stop-color="#FFF2B2" />
    </linearGradient>

    <!-- Accent Cyan/Atlas Shimmer Gradient -->
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#navyBg)" filter="url(#cardShadow)" />
  
  <!-- Outer Metallic Border Trim -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.6" />
  
  <!-- Inner Subtle Glow Ring -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.08" />

  <!-- Outer Concentric WiFi Broadcast Arcs (Top) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-linecap="round">
    <!-- Outer Arc -->
    <path d="M 120 190 A 170 170 0 0 1 392 190" stroke-width="8" stroke-opacity="0.35" />
    <!-- Middle Arc -->
    <path d="M 160 215 A 120 120 0 0 1 352 215" stroke-width="9" stroke-opacity="0.75" />
    <!-- Inner Arc -->
    <path d="M 200 240 A 70 70 0 0 1 312 240" stroke-width="10" filter="url(#goldGlow)" />
  </g>

  <!-- Central Audio Waveform Equalizer Bars (Sound Sync Core) -->
  <g fill="url(#goldGrad)">
    <!-- Bar 1 (Left outermost) -->
    <rect x="136" y="290" width="14" height="60" rx="7" fill-opacity="0.4" />
    
    <!-- Bar 2 -->
    <rect x="166" y="260" width="16" height="120" rx="8" fill-opacity="0.65" />
    
    <!-- Bar 3 -->
    <rect x="198" y="235" width="18" height="170" rx="9" fill-opacity="0.85" />
    
    <!-- Bar 4 (Left-center peak) -->
    <rect x="232" y="210" width="20" height="220" rx="10" filter="url(#goldGlow)" />
    
    <!-- Center Resonant Sync Node / Diamond -->
    <circle cx="256" cy="180" r="10" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    
    <!-- Bar 5 (Right-center peak) -->
    <rect x="260" y="210" width="20" height="220" rx="10" filter="url(#goldGlow)" />
    
    <!-- Bar 6 -->
    <rect x="296" y="235" width="18" height="170" rx="9" fill-opacity="0.85" />
    
    <!-- Bar 7 -->
    <rect x="330" y="260" width="16" height="120" rx="8" fill-opacity="0.65" />
    
    <!-- Bar 8 (Right outermost) -->
    <rect x="362" y="290" width="14" height="60" rx="7" fill-opacity="0.4" />
  </g>

  <!-- Cyan Atlas Acoustic Ripple Pulse at Baseline -->
  <line x1="120" y1="445" x2="392" y2="445" stroke="url(#cyanAccent)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
  <circle cx="256" cy="445" r="4" fill="#38BDF8" filter="url(#goldGlow)" />
</svg>
